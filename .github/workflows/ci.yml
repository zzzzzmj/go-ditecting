name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: gofmt -w ./cmd ./internal && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...

  migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Create isolated migration databases
        run: mysql -h127.0.0.1 -uroot -proot_password -e "CREATE DATABASE diting_fresh CHARACTER SET utf8mb4; CREATE DATABASE diting_upgrade CHARACTER SET utf8mb4;"
      - name: Migrate an empty database
        env:
          MIGRATION_DATABASE_URL: mysql://root:root_password@tcp(127.0.0.1:3306)/diting_fresh?multiStatements=true
        run: go run ./cmd/migrate up
      - name: Run store integration tests
        env:
          TEST_DATABASE_DSN: root:root_password@tcp(127.0.0.1:3306)/diting_fresh?charset=utf8mb4&parseTime=true&loc=UTC
        run: go test -tags=integration -run TestMySQLMigratedSchema ./internal/store
      - name: Load the previous production schema
        run: mysql -h127.0.0.1 -uroot -proot_password diting_upgrade < db/testdata/legacy_schema.sql
      - name: Upgrade the previous production schema
        env:
          MIGRATION_DATABASE_URL: mysql://root:root_password@tcp(127.0.0.1:3306)/diting_upgrade?multiStatements=true
        run: go run ./cmd/migrate up
      - name: Verify upgraded version and preserved data
        run: |
          test "$(mysql -N -s -h127.0.0.1 -uroot -proot_password diting_upgrade -e 'SELECT CONCAT(version, ":", dirty) FROM schema_migrations')" = "3:0"
          test "$(mysql -N -s -h127.0.0.1 -uroot -proot_password diting_upgrade -e "SELECT COUNT(*) FROM assets WHERE ip='10.20.1.11'")" = "1"
          test "$(mysql -N -s -h127.0.0.1 -uroot -proot_password diting_upgrade -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='diting_upgrade' AND table_name IN ('event_inbox','detection_rules')")" = "2"

